<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern and interactive authentication portal with Dark Mode and Password Strength Checker.">
    <title>Auth Portal | Login & Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
    <!-- Theme Toggle Button -->
    <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle Theme">
        <span id="themeIcon">☀️</span>
    </button>

    <div class="auth-container">
        <!-- Floating Ambient Glows -->
        <div class="glow-sphere glow-1"></div>
        <div class="glow-sphere glow-2"></div>

        <div class="auth-card">
            <!-- Tab Switcher -->
            <div class="tab-header">
                <button type="button" class="tab-btn active" id="loginTab">Sign In</button>
                <button type="button" class="tab-btn" id="signupTab">Sign Up</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active" novalidate>
                <div class="form-header">
                    <h1>Welcome Back</h1>
                    <p>Enter your credentials to access your account</p>
                </div>

                <!-- Social Login Buttons -->
                <div class="social-auth">
                    <button type="button" class="social-btn" id="googleLogin">
                        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/><path fill="#FBBC05" d="M5.6 14.8c-.3-.8-.4-1.8-.4-2.8s.2-2 .4-2.8L1.9 6.3C.7 8.7 0 10.3 0 12s.7 3.3 1.9 5.7l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/></svg>
                        <span>Google</span>
                    </button>
                    <button type="button" class="social-btn" id="githubLogin">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                        <span>GitHub</span>
                    </button>
                </div>

                <div class="divider"><span>or with email</span></div>

                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="name@company.com" required>
                    <span class="error-msg" id="loginEmailError"></span>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div class="input-with-icon">
                        <input type="password" id="loginPassword" placeholder="Enter your password" required>
                        <button type="button" class="toggle-password-btn" data-target="loginPassword" aria-label="Toggle password">👁️</button>
                    </div>
                    <span class="error-msg" id="loginPasswordError"></span>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="link-btn">Forgot password?</a>
                </div>

                <button type="submit" class="submit-btn" id="loginSubmit">
                    <span class="btn-text">Sign In</span>
                    <span class="spinner"></span>
                </button>
            </form>

            <!-- Sign Up Form -->
            <form id="signupForm" class="auth-form" novalidate>
                <div class="form-header">
                    <h1>Create Account</h1>
                    <p>Get started with your free account today</p>
                </div>

                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <input type="text" id="signupName" placeholder="Muhammad Bilal" required>
                    <span class="error-msg" id="signupNameError"></span>
                </div>

                <div class="form-group">
                    <label for="signupEmail">Email Address</label>
                    <input type="email" id="signupEmail" placeholder="name@company.com" required>
                    <span class="error-msg" id="signupEmailError"></span>
                </div>

                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <div class="input-with-icon">
                        <input type="password" id="signupPassword" placeholder="Create a strong password" required>
                        <button type="button" class="toggle-password-btn" data-target="signupPassword" aria-label="Toggle password">👁️</button>
                    </div>
                    <!-- Password Strength Meter -->
                    <div class="strength-meter-container">
                        <div class="strength-bar-wrapper">
                            <div class="strength-bar" id="strengthBar"></div>
                        </div>
                        <span class="strength-text" id="strengthText">Password Strength</span>
                    </div>
                    <span class="error-msg" id="signupPasswordError"></span>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="agreeTerms" required>
                        <span>I agree to the <a href="#" class="link-btn">Terms & Conditions</a></span>
                    </label>
                </div>
                <span class="error-msg" id="termsError"></span>

                <button type="submit" class="submit-btn" id="signupSubmit">
                    <span class="btn-text">Create Account</span>
                    <span class="spinner"></span>
                </button>
            </form>

            <!-- Alert / Toast Notification -->
            <div id="toastNotification" class="toast-notification"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
